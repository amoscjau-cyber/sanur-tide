name: Update dashboard data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch weather and exchange rates
        run: |
          START=$(date -u -d '7 days ago' +%F)
          curl -sfL "https://api.open-meteo.com/v1/forecast?latitude=-8.67&longitude=115.26&current=temperature_2m,apparent_temperature,weather_code" -o weather.json
          curl -sfL "https://api.frankfurter.app/${START}..?from=AUD&to=IDR" -o rates.json
          jq -n --slurpfile w weather.json --slurpfile r rates.json '{weather: $w[0], rates: $r[0]}' > data.json
          rm weather.json rates.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data" && git push)
