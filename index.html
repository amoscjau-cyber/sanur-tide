<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanur Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            background-color: #0d0d0d;
            border-radius: 20px;
            padding: 25px 30px;
            border: 1px solid #1a1a1a;
        }
        .alert-banner {
            display: none;
            background-color: #5c0606;
            border: 2px solid #ff3b30;
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 15px;
        }
        .alert-banner.active {
            display: flex;
            align-items: center;
        }
        .alert-icon {
            font-size: 2.8rem;
            margin-right: 18px;
        }
        .alert-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff5252;
            margin-bottom: 4px;
        }
        .alert-desc {
            font-size: 1.3rem;
            color: #ffcccc;
        }
        .tide-header {
            display: flex;
            align-items: center;
            font-size: 3.2rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .tide-icon {
            margin-right: 18px;
            font-size: 2.8rem;
        }
        .tide-details {
            font-size: 1.4rem;
            color: #999999;
        }
        .weather-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .weather-left {
            display: flex;
            align-items: center;
        }
        .weather-icon {
            font-size: 2.8rem;
            margin-right: 20px;
        }
        .weather-temp {
            font-size: 3.4rem;
            font-weight: 600;
        }
        .weather-details {
            font-size: 1.4rem;
            color: #999999;
            text-align: right;
        }
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .time-display {
            font-size: 4.4rem;
            font-weight: 500;
            line-height: 1;
        }
        .time-ampm {
            font-size: 1.6rem;
            vertical-align: super;
            margin-left: 4px;
        }
        .date-display {
            font-size: 1.5rem;
            color: #888888;
            margin-top: 6px;
        }
        .exchange-box {
            text-align: right;
        }
        .exchange-label {
            font-size: 1.1rem;
            color: #777777;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .exchange-rate-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 2.8rem;
            font-weight: 500;
        }
        .flag-icon {
            width: 34px;
            height: 22px;
            border-radius: 3px;
            margin-right: 12px;
            background: linear-gradient(to bottom, #d00000 50%, #ffffff 50%);
            display: inline-block;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #333333;
            margin-left: 6px;
            vertical-align: middle;
        }
        .status-dot.live {
            background-color: #28cd41;
        }
    </style>
</head>
<body>

    <div>
        <!-- Active Weather Warning Banner (Red Box) -->
        <div id="weather-alert" class="alert-banner">
            <span class="alert-icon">⚠️</span>
            <div>
                <div class="alert-title" id="alert-title-text">SEVERE WEATHER WARNING</div>
                <div class="alert-desc" id="alert-desc-text">High wind and rough seas advisory active for coastal Bali.</div>
            </div>
        </div>

        <!-- Tide Info Box -->
        <div class="card tide-card">
            <div class="tide-header">
                <span class="tide-icon" id="tide-icon">📉</span>
                <span id="tide-status">Loading Tide...</span>
            </div>
            <div class="tide-details" id="tide-desc">Calculating next tide</div>
        </div>
    </div>

    <!-- Weather / Real Feel Box -->
    <div class="card weather-card">
        <div class="weather-left">
            <span class="weather-icon">🌡️</span>
            <div>
                <div class="weather-temp" id="temp-display">30°C</div>
            </div>
        </div>
        <div class="weather-details">
            <div id="feels-like">RealFeel® 35°C</div>
            <div style="font-size: 1.1rem; color: #777777; margin-top: 4px;">
                Sanur, Bali <span id="weather-dot" class="status-dot"></span>
            </div>
        </div>
    </div>

    <!-- Clock & Currency Row -->
    <div class="bottom-row">
        <div>
            <div class="time-display" id="clock">--:--</div>
            <div class="date-display" id="date">--</div>
        </div>
        <div class="exchange-box">
            <div class="exchange-label">IDR <span id="rate-dot" class="status-dot"></span></div>
            <div class="exchange-rate-container">
                <span class="flag-icon"></span>
                <span id="exchange-rate">12,274</span>
            </div>
        </div>
    </div>

    <script>
        function formatNumberCommas(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function formatTime12(dateObj) {
            var h = dateObj.getHours();
            var m = dateObj.getMinutes();
            var ap = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            if (h === 0) { h = 12; }
            if (m < 10) { m = '0' + m; }
            return h + ':' + m + ' ' + ap;
        }
