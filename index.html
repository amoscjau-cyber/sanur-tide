<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanur Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .tide-card {
            background-color: #0d0d0d;
            border-radius: 20px;
            padding: 35px 30px;
            border: 1px solid #1a1a1a;
        }
        .tide-header {
            display: flex;
            align-items: center;
            font-size: 3.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .tide-icon {
            margin-right: 18px;
            font-size: 3.2rem;
        }
        .tide-details {
            font-size: 1.6rem;
            color: #999999;
        }
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .time-display {
            font-size: 4.8rem;
            font-weight: 500;
            line-height: 1;
        }
        .time-ampm {
            font-size: 1.8rem;
            vertical-align: super;
            margin-left: 4px;
        }
        .date-display {
            font-size: 1.6rem;
            color: #888888;
            margin-top: 8px;
        }
        .exchange-box {
            text-align: right;
        }
        .exchange-label {
            font-size: 1.2rem;
            color: #777777;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .exchange-rate-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 3.2rem;
            font-weight: 500;
        }
        .flag-icon {
            width: 38px;
            height: 25px;
            border-radius: 3px;
            margin-right: 12px;
            background: linear-gradient(to bottom, #d00000 50%, #ffffff 50%);
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Tide Info Box -->
    <div class="tide-card">
        <div class="tide-header">
            <span class="tide-icon" id="tide-icon">📉</span>
            <span id="tide-status">Low Tide in 2h 15m</span>
        </div>
        <div class="tide-details" id="tide-desc">Next low tide expected at 5:15 PM</div>
    </div>

    <!-- Clock & Currency Row -->
    <div class="bottom-row">
        <div>
            <div class="time-display" id="clock">--:--</div>
            <div class="date-display" id="date">--</div>
        </div>
        <div class="exchange-box">
            <div class="exchange-label">IDR</div>
            <div class="exchange-rate-container">
                <span class="flag-icon"></span>
                <span id="exchange-rate">12,274</span>
            </div>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            
            document.getElementById('clock').innerHTML = `${hours}:${minutes}<span class="time-ampm">${ampm}</span>`;
            
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-GB', options);
        }

        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/AUD');
                const data = await res.json();
                if (data && data.rates && data.rates.IDR) {
                    const rate = Math.round(data.rates.IDR);
                    document.getElementById('exchange-rate').innerText = rate.toLocaleString();
                }
            } catch (e) {
                console.log("Using default rate", e);
            }
        }

        updateDateTime();
        fetchExchangeRate();

        setInterval(updateDateTime, 1000);
        setInterval(fetchExchangeRate, 3600000);
    </script>
</body>

    </script>
</body>
</html>
