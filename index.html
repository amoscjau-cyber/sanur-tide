<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanur Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            width: 100%;
            min-height: 100%;
            padding: 20px;
        }
        .card {
            background-color: #111111;
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid #222222;
            margin-bottom: 16px;
        }
        .alert-banner {
            display: none;
            background-color: #5c0606;
            border: 2px solid #ff3b30;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .alert-banner.active {
            display: block;
        }
        .alert-title {
            font-size: 24px;
            font-weight: bold;
            color: #ff5252;
            margin-bottom: 4px;
        }
        .alert-desc {
            font-size: 18px;
            color: #ffcccc;
        }
        .tide-status {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .tide-desc {
            font-size: 20px;
            color: #aaaaaa;
        }
        .feels-like-line {
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .location-line {
            font-size: 18px;
            color: #888888;
        }
        .bottom-table {
            width: 100%;
            margin-top: 10px;
        }
        .time-display {
            font-size: 52px;
            font-weight: bold;
            line-height: 1.1;
        }
        .ampm-text {
            font-size: 24px;
        }
        .date-display {
            font-size: 20px;
            color: #999999;
            margin-top: 4px;
        }
        .exchange-box {
            text-align: right;
            margin-top: 14px;
        }
        .exchange-label {
            font-size: 16px;
            color: #888888;
            margin-bottom: 4px;
        }
        .exchange-rate {
            font-size: 38px;
            font-weight: bold;
        }
        .flag-box {
            display: inline-block;
            width: 36px;
            height: 22px;
            margin-right: 10px;
            vertical-align: middle;
            background-color: #d00000;
            border-top: 11px solid #d00000;
            border-bottom: 11px solid #ffffff;
        }
        .trend-up {
            color: #28cd41;
        }
        .trend-down {
            color: #ff453a;
        }
        .trend-flat {
            color: #888888;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: #444444;
            margin-left: 6px;
            vertical-align: middle;
        }
        .status-dot.live {
            background-color: #28cd41;
        }
    </style>
</head>
<body>

    <div id="weather-alert" class="alert-banner">
        <div class="alert-title" id="alert-title-text">SEVERE WEATHER WARNING</div>
        <div class="alert-desc" id="alert-desc-text">High wind and rough seas advisory active for coastal Bali.</div>
    </div>

    <div class="card">
        <div class="tide-status" id="tide-status">Loading Tide...</div>
        <div class="tide-desc" id="tide-desc">Calculating next tide</div>
    </div>

    <div class="card">
        <div class="feels-like-line">
            <span id="feels-like">RealFeel 35C</span>
            <span id="temp-trend" class="trend-flat">=</span>
        </div>
        <div class="location-line">
            Sanur, Bali <span id="weather-dot" class="status-dot"></span>
        </div>
    </div>

    <div class="bottom-table">
        <div class="time-display" id="clock">--:--</div>
        <div class="date-display" id="date">--</div>

        <div class="exchange-box">
            <div class="exchange-label">IDR <span id="rate-dot" class="status-dot"></span></div>
            <div class="exchange-rate">
                <span class="flag-box"></span>
                <span id="exchange-rate">12,274</span>
                <span id="rate-trend" class="trend-flat">=</span>
            </div>
        </div>
    </div>

    <script>
        var lastRate = 12274;
        var lastFeelsLike = 35;

        function addCommas(n) {
            var s = String(n);
            var out = "";
            while (s.length > 3) {
                out = "," + s.slice(-3) + out;
                s = s.slice(0, -3);
            }
            return s + out;
        }

        function formatTime12(d) {
            var h = d.getHours();
            var m = d.getMinutes();
            var ap = h >= 12 ? "PM" : "AM";
            h = h % 12;
            if (h === 0) { h = 12; }
            if (m < 10) { m = "0" + m; }
            return h + ":" + m + " " + ap;
        }

        function setTrend(el, currentVal, previousVal) {
            if (!el) { return; }
            if (currentVal > previousVal) {
                el.innerHTML = "&#9650;";
                el.className = "trend-up";
            } else if (currentVal < previousVal) {
                el.innerHTML = "&#9660;";
                el.className = "trend-down";
            } else {
                el.innerHTML = "=";
                el.className = "trend-flat";
            }
        }

        function updateClockAndTide() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            var ap = h >= 12 ? "PM" : "AM";
            h = h % 12;
            if (h === 0) { h = 12; }
            var mStr = m < 10 ? "0" + m : String(m);

            var clockEl = document.getElementById("clock");
            if (clockEl) {
                clockEl.innerHTML = h + ":" + mStr + ' <span class="ampm-text">' + ap + "</span>";
            }

            var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            var months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            var dateEl = document.getElementById("date");
            if (dateEl) {
                dateEl.innerHTML = days[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()];
            }

            // Continuous lunar tide cycle anchored to Nov 18, 2026 4:33 PM High Tide
            var anchorHigh = new Date(2026, 10, 18, 16, 33, 0).getTime();
            var nowMs = now.getTime();
            var halfCycleMs = 22350 * 1000;

            var elapsed = nowMs - anchorHigh;
            var cyclesPassed = Math.floor(elapsed / halfCycleMs);
            var nextEventMs = anchorHigh + ((cyclesPassed + 1) * halfCycleMs);
            var nextEventDate = new Date(nextEventMs);

            var isNextHigh = ((cyclesPassed + 1) % 2 === 0);
            var tideLabel = isNextHigh ? "High Tide" : "Low Tide";

            var diffSec = Math.floor((nextEventMs - nowMs) / 1000);
            if (diffSec < 0) { diffSec = 0; }

            var tHours = Math.floor(diffSec / 3600);
            var tMins = Math.floor((diffSec % 3600) / 60);

            var statusEl = document.getElementById("tide-status");
            if (statusEl) {
                if (tHours > 0) {
                    var minPad = tMins < 10 ? "0" + tMins : tMins;
                    statusEl.innerHTML = tideLabel + " in " + tHours + "h " + minPad + "m";
                } else {
                    statusEl.innerHTML = tideLabel + " in " + tMins + " mins";
                }
            }

            var descEl = document.getElementById("tide-desc");
            if (descEl) {
                descEl.innerHTML = "Next " + tideLabel.toLowerCase() + " expected at " + formatTime12(nextEventDate);
            }
        }

        // JSONP callback for Open-Meteo (avoids XHR / CORS blocks on Android 4.4)
        function handleWeather(data) {
            if (!data || !data.current) { return; }
            var apparent = Math.round(data.current.apparent_temperature);
            var wcode = data.current.weather_code;

            setTrend(document.getElementById("temp-trend"), apparent, lastFeelsLike);
            lastFeelsLike = apparent;

            var feelsEl = document.getElementById("feels-like");
            if (feelsEl) {
                feelsEl.innerHTML = "RealFeel " + apparent + "C";
            }

            var wDot = document.getElementById("weather-dot");
            if (wDot) {
                wDot.className = "status-dot live";
            }

            var alertBox = document.getElementById("weather-alert");
            if (alertBox) {
                if (wcode >= 95) {
                    document.getElementById("alert-title-text").innerHTML = "SEVERE THUNDERSTORM WARNING";
                    document.getElementById("alert-desc-text").innerHTML = "Heavy storm activity reported in the Sanur / Denpasar area.";
                    alertBox.className = "alert-banner active";
                } else {
                    alertBox.className = "alert-banner";
                }
            }
        }

        function loadWeatherScript() {
            var s = document.createElement("script");
            s.src = "https://api.open-meteo.com/v1/forecast?latitude=-8.67&longitude=115.26&current=apparent_temperature,weather_code&callback=handleWeather";
            document.body.appendChild(s);
        }

        function tryExchangeUrl(url, onFail) {
            try {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try {
                                var data = JSON.parse(xhr.responseText);
                                if (data && data.rates && data.rates.IDR) {
                                    var rate = Math.round(data.rates.IDR);
                                    setTrend(document.getElementById("rate-trend"), rate, lastRate);
                                    lastRate = rate;
                                    document.getElementById("exchange-rate").innerHTML = addCommas(rate);
                                    document.getElementById("rate-dot").className = "status-dot live";
                                    return;
                                }
                            } catch (e) {}
                        }
                        if (onFail) { onFail(); }
                    }
                };
                xhr.send();
            } catch (e) {
                if (onFail) { onFail(); }
            }
        }

        function fetchExchangeRate() {
            tryExchangeUrl("https://api.frankfurter.app/latest?from=AUD&to=IDR", function() {
                tryExchangeUrl("https://open.er-api.com/v6/latest/AUD", null);
            });
        }

        updateClockAndTide();
        loadWeatherScript();
        fetchExchangeRate();

        setInterval(updateClockAndTide, 1000);
        setInterval(loadWeatherScript, 900000);
