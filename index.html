<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanur Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            background-color: #0d0d0d;
            border-radius: 20px;
            padding: 25px 30px;
            border: 1px solid #1a1a1a;
        }
        .alert-banner {
            display: none;
            background-color: #5c0606;
            border: 2px solid #ff3b30;
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 15px;
        }
        .alert-banner.active {
            display: flex;
            align-items: center;
        }
        .alert-icon {
            font-size: 2.8rem;
            margin-right: 18px;
        }
        .alert-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff5252;
            margin-bottom: 4px;
        }
        .alert-desc {
            font-size: 1.3rem;
            color: #ffcccc;
        }
        .tide-header {
            display: flex;
            align-items: center;
            font-size: 3.2rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .tide-icon {
            margin-right: 18px;
            font-size: 2.8rem;
        }
        .tide-details {
            font-size: 1.4rem;
            color: #999999;
        }
        .weather-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .feels-like-main {
            font-size: 3.2rem;
            font-weight: 600;
        }
        .weather-location {
            font-size: 1.2rem;
            color: #777777;
            text-align: right;
        }
        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .time-display {
            font-size: 4.4rem;
            font-weight: 500;
            line-height: 1;
        }
        .time-ampm {
            font-size: 1.6rem;
            vertical-align: super;
            margin-left: 4px;
        }
        .date-display {
            font-size: 1.5rem;
            color: #888888;
            margin-top: 6px;
        }
        .exchange-box {
            text-align: right;
        }
        .exchange-label {
            font-size: 1.1rem;
            color: #777777;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .exchange-rate-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 2.8rem;
            font-weight: 500;
        }
        .flag-icon {
            width: 34px;
            height: 22px;
            border-radius: 3px;
            margin-right: 12px;
            background: linear-gradient(to bottom, #d00000 50%, #ffffff 50%);
            display: inline-block;
        }
        .trend-arrow {
            margin-left: 10px;
            font-size: 1em;
        }
        .trend-up {
            color: #28cd41;
        }
        .trend-down {
            color: #ff453a;
        }
        .trend-flat {
            color: #777777;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #333333;
            margin-left: 6px;
            vertical-align: middle;
        }
        .status-dot.live {
            background-color: #28cd41;
        }
    </style>
</head>
<body>

    <div>
        <!-- Active Weather Warning Banner (Red Box) -->
        <div id="weather-alert" class="alert-banner">
            <span class="alert-icon">⚠️</span>
            <div>
                <div class="alert-title" id="alert-title-text">SEVERE WEATHER WARNING</div>
                <div class="alert-desc" id="alert-desc-text">High wind and rough seas advisory active for coastal Bali.</div>
            </div>
        </div>

        <!-- Tide Info Box -->
        <div class="card tide-card">
            <div class="tide-header">
                <span class="tide-icon" id="tide-icon">📉</span>
                <span id="tide-status">Loading Tide...</span>
            </div>
            <div class="tide-details" id="tide-desc">Calculating next tide</div>
        </div>
    </div>

    <!-- Real Feel Only Box -->
    <div class="card weather-card">
        <div class="feels-like-main">
            <span id="feels-like">RealFeel® 35°C</span>
            <span id="temp-trend" class="trend-arrow trend-flat">—</span>
        </div>
        <div class="weather-location">
            Sanur, Bali <span id="weather-dot" class="status-dot"></span>
        </div>
    </div>

    <!-- Clock & Currency Row -->
    <div class="bottom-row">
        <div>
            <div class="time-display" id="clock">--:--</div>
            <div class="date-display" id="date">--</div>
        </div>
        <div class="exchange-box">
            <div class="exchange-label">IDR <span id="rate-dot" class="status-dot"></span></div>
            <div class="exchange-rate-container">
                <span class="flag-icon"></span>
                <span id="exchange-rate">12,274</span>
                <span id="rate-trend" class="trend-arrow trend-flat">—</span>
            </div>
        </div>
    </div>

    <script>
        var lastRate = 12274;
        var lastFeelsLike = 35;

        function formatNumberCommas(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function formatTime12(dateObj) {
            var h = dateObj.getHours();
            var m = dateObj.getMinutes();
            var ap = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            if (h === 0) { h = 12; }
            if (m < 10) { m = '0' + m; }
            return h + ':' + m + ' ' + ap;
        }

        function updateAll() {
            try {
                var now = new Date();
                var hours = now.getHours();
                var minutes = now.getMinutes();
                if (minutes < 10) { minutes = '0' + minutes; }
                
                var ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                if (hours === 0) { hours = 12; }
                
                document.getElementById('clock').innerHTML = hours + ':' + minutes + '<span class="time-ampm">' + ampm + '</span>';
                
                var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                
                var dateString = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
                document.getElementById('date').innerText = dateString;

                // Continuous lunar tide cycle anchored to Nov 18, 2026 4:33 PM High Tide
                var anchorHigh = new Date(2026, 10, 18, 16, 33, 0).getTime();
                var nowMs = now.getTime();
                var halfCycleMs = 22350 * 1000;

                var elapsed = nowMs - anchorHigh;
                var cyclesPassed = Math.floor(elapsed / halfCycleMs);
                var nextEventMs = anchorHigh + ((cyclesPassed + 1) * halfCycleMs);
                var nextEventDate = new Date(nextEventMs);

                var isNextHigh = ((cyclesPassed + 1) % 2 === 0);
                var tideLabel = isNextHigh ? 'High Tide' : 'Low Tide';
                var tideIcon = isNextHigh ? '📈' : '📉';

                var diffSec = Math.floor((nextEventMs - nowMs) / 1000);
                if (diffSec < 0) { diffSec = 0; }

                var tHours = Math.floor(diffSec / 3600);
                var tMins = Math.floor((diffSec % 3600) / 60);

                document.getElementById('tide-icon').innerText = tideIcon;
                if (tHours > 0) {
                    var minStr = tMins < 10 ? '0' + tMins : tMins;
                    document.getElementById('tide-status').innerText = tideLabel + ' in ' + tHours + 'h ' + minStr + 'm';
                } else {
                    document.getElementById('tide-status').innerText = tideLabel + ' in ' + tMins + ' mins';
                }

                document.getElementById('tide-desc').innerText = 'Next ' + tideLabel.toLowerCase() + ' expected at ' + formatTime12(nextEventDate);
            } catch (e) {}
        }

        function legacyGet(url, callback, onError) {
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try {
                                var data = JSON.parse(xhr.responseText);
                                callback(data);
                            } catch (parseErr) {
                                if (onError) onError();
                            }
                        } else {
                            if (onError) onError();
                        }
                    }
                };
                xhr.send();
            } catch (reqErr) {
                if (onError) onError();
            }
        }

        function setTrendElement(el, newVal, prevVal) {
            if (newVal > prevVal) {
                el.innerText = '▲';
                el.className = 'trend-arrow trend-up';
            } else if (newVal < prevVal) {
                el.innerText = '▼';
                el.className = 'trend-arrow trend-down';
            } else {
                el.innerText = '—';
                el.className = 'trend-arrow trend-flat';
            }
        }

        function fetchWeather() {
            var url = 'http://api.open-meteo.com/v1/forecast?latitude=-8.67&longitude=115.26&current=apparent_temperature,weather_code';
            legacyGet(url, function(data) {
                if (data && data.current) {
                    var apparent = Math.round(data.current.apparent_temperature);
                    var wcode = data.current.weather_code;

                    setTrendElement(document.getElementById('temp-trend'), apparent, lastFeelsLike);
                    lastFeelsLike = apparent;

                    document.getElementById('feels-like').innerText = 'RealFeel® ' + apparent + '°C';
                    document.getElementById('weather-dot').className = 'status-dot live';

                    var alertBox = document.getElementById('weather-alert');
                    if (wcode >= 95) {
                        document.getElementById('alert-title-text
